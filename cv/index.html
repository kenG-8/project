<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV - Nguyễn Tất Trung</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
  <audio src="audio/au1.mp3" id="audio"></audio>
  <canvas id="stars"></canvas>

  <div class="cv">
    <form action="" class="cv-form">
      <div class="home">
        <div class="classname">
          <div class="top-line">
            <h1 class="name ">Nguyễn Tất Trung</h1>
          </div>
          <p class="nickname">TrungG</p>
        </div>

        <div class="typewriter">
          <span class="static-text">Lập trình viên:</span>
          <span class="dynamic-text"></span>
        </div>

        <div class="gallery">
          <img id="gallery-img" src="img/a1.png" alt="Hình ảnh">
        </div>
      </div>

      <div class="info">
        <div class="page">
          <img src="t1.png" alt="" class="avatar item">
          <div class="info-name">
            <h2 class="cvname item ">Nguyễn Tất Trung</h2>
            <h2 class="cvclass item ">T1K46 - THPT Đô Lương 3</h2>
            <h2 class="job item ">Lập trình viên Frontend</h2>
          </div>

          <div class="linkpage">
            <div class="link item">
              <a target="_blank" href="https://www.facebook.com/trung.gtat" class="addres fb"><i class="fa-brands fa-facebook"></i> Fb: TrungGTất</a>
            </div>
            <div class="link item">
              <a target="_blank" href="https://www.tiktok.com/@trungg2737" class="addres tiktok"><i class="fa-brands fa-tiktok"></i> TikTok: TrungGTất</a>
            </div>
            <div class="link item">
              <a target="_blank" href="https://www.instagram.com/trungg.24/"  class="addres ig"><i class="fa-brands fa-instagram"></i> IG: trungg.24</a>
            </div>
            <div class="link item">
              <a target="_blank" href="https://github.com/kenG-8" class="addres ig"><i class="fa-brands fa-github"></i> github:KenG-8</a>
            </div>
            <p class="email"><i class="fa-regular fa-envelope"></i>Email:kengtop24@gamil.com</p>
          </div>
        </div>
      </div>
    </form>

    <div class="music-box">
      <span class="song-title"></span>
      <button id="next-song"><i class="fa-solid fa-forward"></i></button>
    </div>
  </div>
  <!-- chủ nhật with TrungG -->
  <script src="script.js"></script>
</body>
</html>
