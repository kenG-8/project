<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <title>Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Pink checkered background */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
        }

        .bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, 0.12) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.12) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.12) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.12) 75%);
            background-size: 30px 30px;
            background-position: 0 0, 0 15px, 15px -15px, -15px 0;
        }

        /* Floating pink petals */
        .petal {
            position: fixed;
            color: #f48fb1;
            opacity: 0.2;
            pointer-events: none;
            animation: floatPetal 7s ease-in-out infinite;
            z-index: 1;
        }

        .petal-1 {
            top: 12%;
            left: 6%;
            font-size: 20px;
            animation-delay: 0s;
        }

        .petal-2 {
            top: 55%;
            left: 4%;
            font-size: 16px;
            animation-delay: 2s;
        }

        .petal-3 {
            top: 35%;
            right: 92%;
            font-size: 14px;
            animation-delay: 1s;
        }

        .petal-4 {
            top: 75%;
            left: 50%;
            font-size: 12px;
            animation-delay: 3s;
        }

        @keyframes floatPetal {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-18px) rotate(20deg);
            }
        }

        /* Main content */
        .home-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 20px;
            width: 100%;
            max-width: 580px;
        }

        /* Cards grid */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            width: 100%;
        }

        .card {
            background: rgba(255, 220, 235, 0.5);
            border-radius: 16px;
            padding: 36px 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 12px rgba(233, 30, 99, 0.06);
            text-decoration: none;
            margin: 15px;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.5);
            box-shadow: 0 12px 35px rgba(233, 30, 99, 0.18);
            background: rgba(255, 220, 235, 0.75);
            border-color: rgba(233, 30, 99, 0.15);
        }

        .card:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Emoji-style icons */
        .card-emoji {
            font-size: 56px;
            line-height: 1;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
        }

        .card-emoji img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(233, 30, 99, 0.2));
        }

        .card:hover .card-emoji {
            animation: wiggle 0.5s ease infinite;
        }


        @keyframes wiggle {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-8deg);
            }

            75% {
                transform: rotate(8deg);
            }
        }


        .card-label {
            font-size: 14px;
            font-weight: 700;
            color: #e91e63;
            letter-spacing: 0.3px;
        }

        /* Stagger animation */
        .card:nth-child(1) {
            animation: slideUp 0.4s ease 0.1s both;
        }

        .card:nth-child(2) {
            animation: slideUp 0.4s ease 0.2s both;
        }

        .card:nth-child(3) {
            animation: slideUp 0.4s ease 0.3s both;
        }

        .card:nth-child(4) {
            animation: slideUp 0.4s ease 0.4s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Bottom bar */
        .bottom-bar {
            position: fixed;
            bottom: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 18px;
            z-index: 10;
        }

        .play-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: white;
            font-size: 18px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(233, 30, 99, 0.35);
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        .bottom-icons {
            display: flex;
            gap: 10px;
        }

        .bottom-icons i {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .bottom-icons i:hover {
            color: white;
        }

        @media (max-width: 420px) {
            .cards-grid {
                gap: 10px;
            }

            .card {
                padding: 20px 12px;
            }

            .card-emoji {
                font-size: 40px;
            }
        }

        /* ===== MUSIC PLAYER OVERLAY ===== */
        .music-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .music-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .music-player {
            background: none;
            border-radius: 28px;
            padding: 24px;
            width: 330px;
            max-width: 95%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(233, 30, 99, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transform: translateY(40px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            /* Sharp Text Fixes */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        .music-player::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 230, 240, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: -1;
            border-radius: inherit;
        }

        .music-overlay.active .music-player {
            transform: translateY(0);
        }

        /* Header */
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .player-header span {
            font-size: 11px;
            font-weight: 700;
            color: #c2185b;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .player-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(233, 30, 99, 0.12);
            border: none;
            color: #e91e63;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .player-close:hover {
            background: #e91e63;
            color: white;
        }

        /* Album art */
        .player-art {
            width: 180px;
            height: 180px;
            border-radius: 20px;
            overflow: hidden;
            margin: 0 auto 16px;
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.2);
        }

        .player-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-art.playing {
            animation: artPulse 2s ease-in-out infinite;
        }

        @keyframes artPulse {

            0%,
            100% {
                box-shadow: 0 8px 30px rgba(233, 30, 99, 0.2);
            }

            50% {
                box-shadow: 0 8px 40px rgba(233, 30, 99, 0.4);
            }
        }

        /* Song info */
        .player-song {
            text-align: center;
            margin-bottom: 14px;
        }

        .player-song h3 {
            font-size: 17px;
            font-weight: 700;
            color: #880e4f;
            margin-bottom: 2px;
        }

        /* Progress bar */
        .player-progress {
            margin-bottom: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(233, 30, 99, 0.15);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e91e63, #f06292);
            border-radius: 10px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 11px;
            color: #c2185b;
            opacity: 0.7;
        }

        /* Controls */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 18px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #c2185b;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 6px;
        }

        .ctrl-btn:hover {
            color: #e91e63;
            transform: scale(1.15);
        }

        .ctrl-play {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: white;
            font-size: 20px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 18px rgba(233, 30, 99, 0.35);
            transition: all 0.2s ease;
        }

        .ctrl-play:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(233, 30, 99, 0.5);
        }

        /* Playlist */
        .playlist {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            max-height: 180px;
            padding-right: 4px;
        }

        /* Custom scrollbar */
        .playlist::-webkit-scrollbar {
            width: 4px;
        }

        .playlist::-webkit-scrollbar-track {
            background: rgba(233, 30, 99, 0.06);
            border-radius: 10px;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #f48fb1, #e91e63);
            border-radius: 10px;
        }

        .playlist::-webkit-scrollbar-thumb:hover {
            background: #e91e63;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.3);
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .playlist-item.active {
            background: rgba(233, 30, 99, 0.12);
        }

        .playlist-item .pl-icon {
            font-size: 14px;
            color: #e91e63;
        }

        .playlist-item .pl-name {
            font-size: 13px;
            font-weight: 600;
            color: #880e4f;
            flex: 1;
        }

        .playlist-item.active .pl-name {
            color: #e91e63;
        }

        /* ===== IMAGE GALLERY MODAL ===== */
        .image-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .image-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .image-modal {
            background: none;
            border-radius: 40px;
            padding: 30px;
            width: 95%;
            max-width: 460px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
            transform: translateY(40px);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            /* Sharp Text Fixes */
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .image-modal::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: -1;
            border-radius: inherit;
        }

        .image-overlay.active .image-modal {
            transform: translateY(0);
        }

        .modal-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .modal-header .rabbit-icon {
            font-size: 36px;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.1));
        }

        .modal-header .modal-title {
            color: #d81b60;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: 24px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .close-image-btn {
            width: 34px;
            height: 34px;
            background: rgba(233, 30, 99, 0.85);
            border-radius: 50%;
            border: 2px solid #fff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
            transition: all 0.3s ease;
        }

        .close-image-btn:hover {
            background: #c2185b;
            transform: rotate(90deg) scale(1.1);
        }

        .sliding-images-box {
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px 0;
            perspective: 1000px;
        }

        .image-row {
            display: flex;
            gap: 15px;
            width: fit-content;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }

        .image-row img {
            height: 160px;
            width: auto;
            min-width: 100px;
            object-fit: contain;
            /* Ensure full image visibility without stretching */
            border-radius: 12px;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            image-rendering: -webkit-optimize-contrast;
            /* Sharper rendering on Chrome/Safari */
            image-rendering: auto;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .image-row img:hover {
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 12px 25px rgba(233, 30, 99, 0.3);
        }

        .row-left {
            animation: scrollLeft 40s linear infinite;
        }

        .row-right {
            animation: scrollRight 40s linear infinite;
        }

        @keyframes scrollLeft {
            0% {
                transform: translate3d(0, 0, 0);
            }

            100% {
                transform: translate3d(-50%, 0, 0);
            }
        }

        @keyframes scrollRight {
            0% {
                transform: translate3d(-50%, 0, 0);
            }

            100% {
                transform: translate3d(0, 0, 0);
            }
        }


        .modal-footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .modal-footer .modal-title {
            color: #d81b60;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: 24px;
        }

        .rabbit-hearts {
            font-size: 28px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        /* Lightbox styling */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            animation: fadeIn 0.3s ease forwards;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
            border: 5px solid #fff;
            transform: scale(0.9);
            animation: zoomIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes zoomIn {
            to {
                transform: scale(1);
            }
        }

        /* Gift Overlay Styling */
        .gift-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 400;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeIn 0.4s ease;
        }

        .gift-modal {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            width: 90%;
            max-width: 500px;
            height: 80vh;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.9);
            animation: zoomIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .close-gift-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #ff4081;
            color: white;
            border: none;
            cursor: pointer;
            z-index: 10;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .close-gift-btn:hover {
            transform: rotate(90deg) scale(1.1);
            background: #f50057;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== LETTER OVERLAY ===== */
        .letter-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 150;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: fadeIn 0.4s ease;
        }

        .letter-modal {
            background: none;
            border-radius: 30px;
            width: 95%;
            max-width: 500px;
            max-height: 85vh;
            position: relative;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            transform: translateY(40px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            /* Sharp Rendering */
            -webkit-font-smoothing: antialiased;
        }

        .letter-modal::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #fffafa 0%, #fff5f8 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: -1;
            border-radius: inherit;
        }

        .letter-header {
            padding: 30px 40px 5px;
            text-align: left;
        }

        .letter-header h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 24px;
            color: #ad1457;
            font-weight: 700;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .letter-content {
            padding: 0px 45px 70px;
            overflow-y: auto;
            font-family: 'Dancing Script', cursive;
            line-height: 2.4;
            color: #880e4f;
            font-size: 22px;
            text-align: left;
            text-rendering: optimizeLegibility;
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* IE and Edge */
        }

        .letter-content::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, Opera */
        }

        .letter-gif {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 90px;
            pointer-events: none;
            z-index: 5;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: scale(0.5);
        }

        .letter-overlay.active .letter-gif {
            opacity: 1;
            transform: scale(1);
        }

        .letter-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            background: #ff4081;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid #fff;
            transition: all 0.3s;
            z-index: 10;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(255, 64, 129, 0.3);
        }

        .letter-close-btn:hover {
            transform: rotate(90deg) scale(1.1);
            background: #c2185b;
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .gift-modal {
                width: 95%;
                height: 85vh;
            }

            .letter-modal {
                width: 95%;
                max-height: 85vh;
            }
        }

        /* Rain effect */
        .gifrain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .rain-item {
            position: absolute;
            top: -100px;
            width: 40px;
            height: auto;
            opacity: 0.8;
            animation: rainFall linear forwards;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        @keyframes rainFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>


</head>

<body>

    <!-- Checkered pink background -->

        <!-- Cards -->
        <div class="cards-grid">

            <a class="card" href="javascript:void(0)" onclick="openImageOverlay()">
                <span class="card-emoji"><img style="width: 100%; height: 100%; object-fit: contain;"

            <a class="card" href="javascript:void(0)" onclick="openGiftOverlay()">
                <span class="card-emoji"><img src="assset/img/gif.png" alt=""></span>

    <!-- Music Player Overlay -->
    <div class="music-overlay" id="musicOverlay" onclick="closeMusicPlayer(event)">
        <div class="music-player" onclick="event.stopPropagation()">
            <div class="player-header">
                <span>🎧 MUSIC PLAYER</span>
                <button class="player-close" onclick="closeMusicPlayer()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="player-art" id="playerArt">
                <img id="alm" src="assset/img/a1.jpg" alt="album art">
            </div>

            <div class="player-song">
                <h3 id="songTitle">In-Love</h3>
            </div>

            <div class="player-progress">
                <div class="progress-bar" id="progressBar" onclick="seekTo(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-time">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <div class="player-controls">
                <button class="ctrl-btn" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="ctrl-play" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-play"
                        id="playIcon"></i></button>
                <button class="ctrl-btn" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>

    <!-- Image Gallery Overlay -->
    <div class="image-overlay" id="imageOverlay" onclick="closeImageOverlay(event)">
        <div class="image-modal" onclick="event.stopPropagation()">
            <div class="modal-header">

                    <img src="assset/img/a1.jpg" onclick="openLightbox(this.src)" alt="photo">

                    <img src="assset/img/a5.jpg" onclick="openLightbox(this.src)" alt="photo">

                <div class="image-row row-right">

                    <!-- Repeat for infinite scroll -->
                    <img src="assset/img/MTO01996.jpg" onclick="openLightbox(this.src)" alt="photo">
                    <img src="assset/img/MTO02000.jpg" onclick="openLightbox(this.src)" alt="photo">
                    <img src="assset/img/MTO02009.jpg" onclick="openLightbox(this.src)" alt="photo">
                    <img src="assset/img/MTO02216.jpg" onclick="openLightbox(this.src)" alt="photo">
                    <img src="assset/img/MTO02220.jpg" onclick="openLightbox(this.src)" alt="photo">

            <div class="modal-footer">
                <div class="modal-title">WOMEN'S DAY</div>
                <div class="rabbit-hearts">🐰💖</div>

    <!-- Lightbox Overlay -->
    <div class="lightbox" id="lightBox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="zoom">
    </div>

    <!-- Gift Overlay -->
    <div class="gift-overlay" id="giftOverlay" onclick="closeGiftOverlay(event)">
        <div class="gift-modal" onclick="event.stopPropagation()">
            <button class="close-gift-btn" onclick="closeGiftOverlay()">&times;</button>
            <div class="iframe-container">
                <iframe src="./index.html?auto=true" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <!-- Letter Overlay -->
    <div class="letter-overlay" id="letterOverlay" onclick="closeLetterOverlay(event)">
        <div class="letter-modal" onclick="event.stopPropagation()">
            <div class="letter-close-btn" onclick="closeLetterOverlay()">&times;</div>
            <div class="letter-header">
                <h2>DEAR người đẹp</h2>
            </div>
            <div class="letter-content" id="letterBody">
                <!-- Content injected by JS -->
            </div>
            <img src="assset/img/mewmew.gif" alt="cute cat" class="letter-gif">
        </div>

    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
        <button class="play-btn" onclick="openMusicPlayer()">
            <i class="fa-solid fa-play"></i>
        </button>
        <div class="bottom-icons">
            <i class="fa-solid fa-shuffle"></i>
            <i class="fa-solid fa-cube"></i>
        </div>
    </div>

    <script>
        // Music Player Logic
        const listaudio = [
            { name: "In-Love", src: "assset/audio/au1.mp3", img: "assset/img/a1.jpg" },
            { name: "Lỡ Say Bye Là Bye", src: "assset/audio/au2.mp3", img: "assset/img/a2.jpg" },
            { name: "Phonecert x Nơi Này Có Anh", src: "assset/audio/au3.mp3", img: "assset/img/a3.jpg" },
            { name: "You Are My Crush", src: "assset/audio/au4.mp3", img: "assset/img/a4.jpg" }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        const audio = new Audio();

        // Build playlist UI
        function buildPlaylist() {
            const pl = document.getElementById('playlist');

            pl.innerHTML = '';
            listaudio.forEach((track, i) => {
                const item = document.createElement('div');
                item.className = 'playlist-item' + (i === currentIndex ? ' active' : '');
                item.innerHTML = `
                    <span class="pl-icon"><i class="fa-solid fa-${i === currentIndex ? 'play' : 'music'}"></i></span>
                    <span class="pl-name">${track.name}</span>
                `;
                item.onclick = () => playSong(i);
                pl.appendChild(item);
            });
        }

        // Load & play song
        function playSong(index) {
            currentIndex = index;
            audio.src = listaudio[index].src;
            document.getElementById('songTitle').textContent = listaudio[currentIndex].name;
            audio.play();
            isPlaying = true;
            updatePlayIcon();
            buildPlaylist();
        }

        // Toggle play/pause
        function togglePlay() {
            if (!audio.src) {
                playSong(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
            } else {
                audio.play();
            }
            isPlaying = !isPlaying;
            updatePlayIcon();
        }

        function updatePlayIcon() {
            const icon = document.getElementById('playIcon');
            const art = document.getElementById('playerArt');
            icon.className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
            if (isPlaying) {
                art.classList.add('playing');
            } else {
                art.classList.remove('playing');
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % listaudio.length;
            playSong(currentIndex);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + listaudio.length) % listaudio.length;
            playSong(currentIndex);
        }
        // Progress bar update
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressFill').style.width = pct + '%';
                document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
                document.getElementById('totalTime').textContent = formatTime(audio.duration);
            }
        });
        // Auto next
        audio.addEventListener('ended', () => nextSong());
        // Seek
        function seekTo(e) {
            const bar = document.getElementById('progressBar');
            const rect = bar.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        // Open / Close
        function openMusicPlayer() {
            document.getElementById('musicOverlay').classList.add('active');
            buildPlaylist();
        }

        function closeMusicPlayer(e) {
            if (e && e.target !== document.getElementById('musicOverlay')) return;
            document.getElementById('musicOverlay').classList.remove('active');
        }

        // Image Overlay Functions
        function openImageOverlay() {
            document.getElementById('imageOverlay').classList.add('active');
        }

        function closeImageOverlay(e) {
            if (e && e.target && e.target !== document.getElementById('imageOverlay') && !e.target.classList.contains('close-image-btn')) return;
            document.getElementById('imageOverlay').classList.remove('active');
        }

        // Lightbox Functions
        function openLightbox(src) {
            const lb = document.getElementById('lightBox');
            const img = document.getElementById('lightboxImg');
            img.src = src;
            lb.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightBox').style.display = 'none';
        }

        // Gift Overlay Functions
        function openGiftOverlay() {
            const overlay = document.getElementById('giftOverlay');
            overlay.style.display = 'flex';
            // Force iframe reload to ensure correct dimensions and start auto-play
            const iframe = overlay.querySelector('iframe');
            if (iframe) iframe.src = iframe.src;
        }

        function closeGiftOverlay(e) {
            if (e && e.target && e.target !== document.getElementById('giftOverlay') && !e.target.classList.contains('close-gift-btn')) return;
            document.getElementById('giftOverlay').style.display = 'none';
        }

        // Letter Overlay Functions
        const letterText = "chào cậu,nhân ngày 8/3,gửi đến cậu những lời chúc tốt đẹp nhất.Chúc cậu ngày luôn hạnh phúc,vui vẻ,đạt được nhiều điều mình mong muốn,mãi là bông hoa xinh đẹp.Luôn nở nủ cười tươi trên môi♥️";

        function openLetterOverlay() {
            const overlay = document.getElementById('letterOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('active'), 10);
            const body = document.getElementById('letterBody');
            body.innerHTML = ''; // Clear previous content
            // Break text into words
            const words = letterText.split(' ');
            words.forEach((word, i) => {
                const span = document.createElement('span');
                span.textContent = word;
                span.style.opacity = '0';
                span.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                span.style.transform = 'translateY(5px)';
                span.style.display = 'inline-block';
                span.style.marginRight = '8px';
                body.appendChild(span);

                // Reveal word by word with poetic rhythm
                setTimeout(() => {
                    span.style.opacity = '1';
                    span.style.transform = 'translateY(0)';
                }, i * 180);
            });
        }
        function closeLetterOverlay(e) {
            if (e && e.target && e.target !== document.getElementById('letterOverlay') && !e.target.classList.contains('letter-close-btn')) return;
            const overlay = document.getElementById('letterOverlay');
            overlay.classList.remove('active');
            setTimeout(() => overlay.style.display = 'none', 400);
        }
        // Init
        buildPlaylist();
        // Load the first song initially
        audio.src = listaudio[currentIndex].src;
        document.getElementById('songTitle').textContent = listaudio[currentIndex].name;
        // Auto-play attempt on load
        window.addEventListener('load', () => {
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    updatePlayIcon();
                }).catch(error => {
                    console.log("Autoplay blocked. Waiting for user interaction.");
                    // Fallback: Play on first click anywhere
                    document.addEventListener('click', () => {
                        if (!isPlaying) {
                            togglePlay();
                        }
                    }, { once: true });
                });
            }
        });
        // Rain Effect Logic
        function createRain() {
            const container = document.querySelector('.gifrain');
            if (!container) return;

            const images = [
                'assset/img/q3.png',
                'assset/img/t2.png',
                'assset/img/t5.png',
                'assset/img/letters.png'
            ];

            const img = document.createElement('img');
            img.src = images[Math.floor(Math.random() * images.length)];
            img.className = 'rain-item';

            const left = Math.random() * 100;
            const duration = Math.random() * 4 + 3; // 3-7s for a more graceful fall
            const size = Math.random() * 25 + 25;   // 25-50px
            const rotation = Math.random() * 360;

            img.style.left = left + '%';
            img.style.animationDuration = duration + 's';
            img.style.width = size + 'px';
            img.style.transform = `rotate(${rotation}deg)`;
            container.appendChild(img);

            setTimeout(() => {
                img.remove();
            }, duration * 1000);
        }

        setInterval(createRain, 800); // Spawns every 800ms for lower density
    </script>
</body>
