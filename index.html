<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Nàng - 8/3</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #ff2d55;
            --text-color: #ffffff;
            --envelope-color: #1a1a1a;
            --envelope-flap: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
        }

        /* Particles Background */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255, 45, 85, 0.8) 0%, rgba(255, 45, 85, 0) 70%);
            border-radius: 50%;
            animation: floatParticle 15s infinite linear;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }

        /* Flying Hearts Background */
        .flying-heart {
            position: absolute;
            bottom: -50px;
            color: var(--accent-color);
            opacity: 0.3;
            pointer-events: none;
            z-index: 2;
            animation: flyUp var(--duration) linear infinite;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.4;
            }

            90% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(-110vh) translateX(var(--drift)) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* Envelope Styling */
        .envelope-wrapper {
            position: relative;
            width: 280px;
            height: 180px;
            background-color: var(--envelope-color);
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .envelope-wrapper:hover {
            transform: scale(1.05);
        }

        .envelope-wrapper.open {
            transform: translateY(100px) scale(0.8);
            opacity: 0;
            pointer-events: none;
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--envelope-flap);
            clip-path: polygon(0 0, 50% 50%, 100% 0);
            z-index: 3;
            transition: transform 0.4s ease;
            transform-origin: top;
        }

        .envelope-wrapper:hover .flap {
            transform: rotateX(160deg);
        }

        .envelope-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--envelope-color);
            clip-path: polygon(0 35%, 50% 50%, 100% 35%, 100% 100%, 0 100%);
            z-index: 4;
        }

        .heart-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-color);
            font-size: 24px;
            z-index: 5;
            filter: drop-shadow(0 0 10px var(--accent-color));
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        /* Wish Sequence container */
        .message-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            pointer-events: none;
            z-index: 20;
        }

        .wish {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-style: italic;
            opacity: 0;
            filter: blur(10px);
            transform: translate(0, -50%) scale(0.8);
            text-shadow: 0 0 30px rgba(255, 45, 85, 0.5);
            position: absolute;
            width: 100%;
            left: 0;
            top: 50%;
            text-align: center;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .wish.active {
            opacity: 1;
            filter: blur(0);
            transform: translate(0, -50%) scale(1);
        }

        .wish.exit {
            opacity: 0;
            filter: blur(20px);
            transform: translate(0, -50%) scale(1.2);
        }

        /* Three.js Canvas Container */
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            display: none;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .click-text {
            margin-top: 20px;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }

        .envelope-wrapper:hover+.click-text {
            opacity: 1;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }
    </style>
</head>

<body>

    <div class="particles" id="particles"></div>
    <div id="heart-container" style="position: absolute; width: 100%; height: 100%; pointer-events: none;"></div>

    <div class="container" id="mainContainer">
        <div class="envelope-wrapper" id="envelope">
            <div class="flap"></div>
            <div class="envelope-front"></div>
            <div class="heart-seal">
                <i class="fa-solid fa-heart"></i>
            </div>
        </div>
        <div class="click-text">Chạm để mở thư</div>
    </div>

    <div class="message-container" id="messageContainer"></div>

    <div id="three-container"></div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const wishes = [
            "Chúc Cậu",
            "8/3 luôn vui vẻ",
            "Có nhiều hạnh phúc trong cuộc sống",
            "Đạt nhiều thành tích",
            "Hãy luôn là bông hoa đẹp nhất nhé",
            "HAPPY WOMEN'S DAY!"
        ];

        // --- Background Effects ---
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 5 + 2;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.animationDelay = `${Math.random() * 15}s`;
            p.style.animationDuration = `${Math.random() * 10 + 10}s`;
            particlesContainer.appendChild(p);
        }

        const heartContainerBackground = document.getElementById('heart-container');
        function createFlyingHeart() {
            const h = document.createElement('i');
            h.className = 'fa-solid fa-heart flying-heart';
            const size = Math.random() * 15 + 10;
            const duration = Math.random() * 5 + 5;
            const drift = (Math.random() - 0.5) * 200;
            h.style.fontSize = `${size}px`;
            h.style.left = `${Math.random() * 100}%`;
            h.style.setProperty('--duration', `${duration}s`);
            h.style.setProperty('--drift', `${drift}px`);
            heartContainerBackground.appendChild(h);
            setTimeout(() => h.remove(), duration * 1000);
        }
        let flyingHeartInterval = setInterval(createFlyingHeart, 600);

        // --- Three.js Heart Aesthetics ---
        let scene, camera, renderer, heartParticles, raycaster, mouse;
        const threeContainer = document.getElementById('three-container');

        function createCircularGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        function initThreeHeart() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 6;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            threeContainer.appendChild(renderer.domElement);

            // Heart Particles
            const particleCount = 60000; // Increased for beauty
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const color = new THREE.Color();

            const heartScale = 1.0;
            let i = 0;
            while (i < particleCount) {
                const x = (Math.random() - 0.5) * 3;
                const y = (Math.random() - 0.5) * 3;
                const z = (Math.random() - 0.5) * 3;

                // Volumetric heart formula
                const val = Math.pow(x * x + (9 / 4) * y * y + z * z - 1, 3) - x * x * z * z * z - (9 / 80) * y * y * z * z * z;

                if (val <= 0) {
                    positions[i * 3] = x * heartScale;
                    positions[i * 3 + 1] = z * heartScale + 0.3;
                    positions[i * 3 + 2] = -y * heartScale;

                    // Color palette: Red -> Magenta -> White
                    const mix = Math.random();
                    if (mix < 0.6) {
                        color.setHSL(0.95 + Math.random() * 0.05, 0.9, 0.5); // Deep Red/Pink
                    } else if (mix < 0.9) {
                        color.setHSL(0.85 + Math.random() * 0.1, 0.8, 0.6); // Magenta/Hot Pink
                    } else {
                        color.setHex(0xffffff); // Pure White glow
                    }

                    colors[i * 3] = color.r;
                    colors[i * 3 + 1] = color.g;
                    colors[i * 3 + 2] = color.b;
                    i++;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.02, // Slightly larger for better glow
                vertexColors: true,
                transparent: true,
                opacity: 0, // Fade in
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
                map: createCircularGlowTexture(),
                depthWrite: false
            });

            heartParticles = new THREE.Points(geometry, material);
            scene.add(heartParticles);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animateThree() {
            requestAnimationFrame(animateThree);
            const time = performance.now() * 0.001;

            if (heartParticles) {
                // Rotation
                heartParticles.rotation.y = time * 0.5;
                heartParticles.rotation.z = Math.sin(time * 0.3) * 0.2;

                // "Breathing" effect - pulsing scale
                const pulse = 1.0 + Math.sin(time * 1.5) * 0.05;
                heartParticles.scale.set(pulse, pulse, pulse);

                // Gentle swaying
                heartParticles.position.y = Math.sin(time * 0.8) * 0.1;

                // Subtle opacity pulse
                if (heartParticles.material.opacity < 0.9) {
                    heartParticles.material.opacity += 0.01;
                }
            }
            renderer.render(scene, camera);
        }

        // --- Sequence Control ---
        const envelope = document.getElementById('envelope');
        const mainContainer = document.getElementById('mainContainer');
        const messageContainer = document.getElementById('messageContainer');

        envelope.addEventListener('click', () => {
            envelope.classList.add('open');
            setTimeout(() => {
                mainContainer.style.display = 'none';
                startWishSequence();
            }, 600);
        });

        async function startWishSequence() {
            for (const wish of wishes) {
                await displayWish(wish);
            }
            showFinale();
        }

        function displayWish(text) {
            return new Promise((resolve) => {
                const wishEl = document.createElement('div');
                wishEl.className = 'wish';
                wishEl.textContent = text;
                messageContainer.appendChild(wishEl);

                setTimeout(() => wishEl.classList.add('active'), 50);

                setTimeout(() => {
                    wishEl.classList.add('exit');
                    setTimeout(() => {
                        wishEl.remove();
                        resolve();
                    }, 800);
                }, 1800);
            });
        }

        function showFinale() {
            // Stop background flying hearts to focus on the 3D heart
            if (flyingHeartInterval) clearInterval(flyingHeartInterval);

            initThreeHeart();
            animateThree();
            threeContainer.style.display = 'block';
            setTimeout(() => {
                threeContainer.style.opacity = '1';
                // No redirect, just keep the heart rotating
            }, 100);
        }
    </script>
</body>

</html>
