<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhìn lại một năm</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    background: linear-gradient(135deg,
        #6a11cb,
        #2575fc,
        #38ef7d
    );
    background-size: 300% 300%;
    animation: gradientMove 10s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* background chuyển động nhẹ */
@keyframes gradientMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container{
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding:45px;
    border-radius:20px;
    text-align:center;
    max-width:650px;
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
    animation: fadeIn 1.5s;
}

h1{
    font-size:38px;
    margin-bottom:20px;
    color:#fff;
}

p{
    font-size:18px;
    line-height:1.7;
    opacity:0.95;
    margin-bottom:35px;
}

button{
    padding:14px 34px;
    font-size:17px;
    border:none;
    border-radius:30px;
    background: linear-gradient(45deg,#ffd200,#ff9a00);
    color:#000;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 25px rgba(255,210,0,0.7);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>
    <div class="container">
        <h1>Nhìn lại một năm của TrungG</h1>
        <p>
            Một năm đã khép lại 🌱<br>
            Mỗi khoảnh khắc đều là một bài học.<br>
            Sẵn sàng bước sang năm mới rực rỡ hơn ✨
        </p>
        <button>Bắt đầu nhìn lại</button>
    </div>
<script>
    const button = document.querySelector('button');

    button.addEventListener('click', () => {
        window.location.href = 'home.html';
    });
</script>   
</body>
</html>
