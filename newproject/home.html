<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhìn lại 2025</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    padding: 40px 20px;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x: hidden;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeInDown 0.8s ease;
}

@keyframes fadeInDown {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.year-title {
    font-size: 72px;
    font-weight: 800;
    letter-spacing: 12px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #fff, #ffd700, #fff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s linear infinite;
    text-shadow: 0 0 30px rgba(255,215,0,0.5);
}

@keyframes shimmer {
    to {
        background-position: 200% center;
    }
}

.subtitle {
    font-size: 18px;
    opacity: 0.9;
    font-weight: 300;
    letter-spacing: 3px;
}

.checklist {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 24px;
    padding: 40px;
    margin-bottom: 50px;
    max-width: 650px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    animation: fadeInUp 0.8s ease 0.2s both;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.checklist h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 24px;
    letter-spacing: 2px;
}

.check-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

.check-item {
    background: rgba(255,255,255,0.15);
    padding: 20px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 2px solid transparent;
}

.check-item:hover {
    background: rgba(255,255,255,0.25);
    transform: translateX(5px);
    border-color: rgba(255,255,255,0.3);
}

.check-item input[type="checkbox"] {
    width: 24px;
    height: 24px;
    cursor: pointer;
    accent-color: #ffd700;
}

.check-item label {
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    flex: 1;
}

.cards-section {
    max-width: 1200px;
    width: 100%;
    margin-bottom: 50px;
}

.section-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 30px;
    letter-spacing: 2px;
    animation: fadeInUp 0.8s ease 0.4s both;
}

.cards-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
    max-width: 900px;
    margin: 0 auto;
}

.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    animation: fadeInUp 0.8s ease both;
}

.card:nth-child(1) { animation-delay: 0.5s; }
.card:nth-child(2) { animation-delay: 0.6s; }
.card:nth-child(3) { animation-delay: 0.7s; }
.card:nth-child(4) { animation-delay: 0.8s; }

.card:hover {
    transform: translateY(-12px) scale(1.03);
    box-shadow: 0 16px 48px rgba(0,0,0,0.2);
    border-color: rgba(255,255,255,0.4);
}

.card-header {
    padding: 20px;
    text-align: center;
    background: rgba(255,255,255,0.1);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
}

.card-img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    transition: transform 0.4s ease;
}

.card:hover .card-img {
    transform: scale(1.1);
}

.cta-button {
    margin-top: 20px;
    animation: fadeInUp 0.8s ease 0.9s both;
}

.cta-button button {
    padding: 18px 50px;
    font-size: 20px;
    font-weight: 700;
    border-radius: 50px;
    border: none;
    background: linear-gradient(135deg, #ffd700, #ff6b6b, #4ecdc4);
    background-size: 200% auto;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
    letter-spacing: 2px;
}

.cta-button button:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    background-position: right center;
}

.cta-button button:active {
    transform: scale(0.98);
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 1000;
    padding: 20px;
}

.modal.show {
    opacity: 1;
    pointer-events: auto;
}

.modal-content {
    position: relative;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(30px);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 24px;
    padding: 30px;
    max-width: 550px;
    width: 100%;
    text-align: center;
    animation: modalZoom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 16px 64px rgba(0,0,0,0.3);
}

@keyframes modalZoom {
    from {
        transform: scale(0.5) rotate(-5deg);
        opacity: 0;
    }
    to {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

.modal-content img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}

.modal-text {
    font-size: 18px;
    line-height: 1.6;
    padding: 10px;
}

.close {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 32px;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.3s ease;
}

.close:hover {
    background: rgba(255,255,255,0.3);
    transform: rotate(90deg);
}

@media (max-width: 768px) {
    .year-title {
        font-size: 48px;
        letter-spacing: 8px;
    }
    
    .cards-grid {
        grid-template-columns: 1fr;
    }
    
    .checklist {
        padding: 25px;
    }
}
</style>
</head>
<body>

<div class="header">
    <div class="year-title">2025</div>
    <div class="subtitle">MỘT NĂM ĐÁNG NHỚ</div>
</div>

<div class="checklist">
    <h2>✨ Mục tiêu năm 2025 ✨</h2>
    <div class="check-grid">
        <div class="check-item">
            <input type="checkbox" id="check1">
            <label for="check1">💕 Có NY</label>
        </div>
        <div class="check-item">
            <input type="checkbox" id="check2">
            <label for="check2">😢 FA</label>
        </div>
        <div class="check-item">
            <input type="checkbox" id="check3">
            <label for="check3">💻 Chăm luyện LeetCode</label>
        </div>
        <div class="check-item">
            <input type="checkbox" id="check4">
            <label for="check4">😴 Ít thức khuya</label>
        </div>
        <div class="check-item">
            <input type="checkbox" id="check5">
            <label for="check5">🎧 Gear mới</label>
        </div>
        <div class="check-item">
            <input type="checkbox" id="check6">
            <label for="check6">💻 Thay PC</label>
        </div>
        <div class="check-item">
            <input type="checkbox" id="check7">
            <label for="check7">💪 Chăm thể dục</label>
        </div>
        <div class="check-item">
            <input type="checkbox" id="check8">
            <label for="check8">🤐 Ít chửi thề</label>
        </div>
        <div class="check-item">
            <input type="checkbox" id="check9">
            <label for="check9">🏆 Đạt HSG Tin</label>
        </div>
        <div class="check-item">
            <input type="checkbox" id="check10">
            <label for="check10">✨ Code không bug</label>
        </div>
    </div>
</div>

<div class="cards-section">
    <h2 class="section-title">🎯 Khoảnh khắc đáng nhớ nhất</h2>
    <div class="cards-grid">
        <div class="card" data-img="i1.png" data-text="Dành cả thanh xuân để gõ code và debug tới sáng 😅 Mỗi dòng code đều là một kỷ niệm đáng nhớ!">
            <div class="card-header">💻 Phần mềm dùng nhiều nhất</div>
            <img class="card-img" src="i1.png" alt="Phần mềm">
        </div>

        <div class="card" data-img="i2.png" data-text="game lol 🎮 nhưng vui">
            <div class="card-header">🎮 Tựa game chơi nhiều nhất</div>
            <img class="card-img" src="i2.png" alt="Game">
        </div>

        <div class="card" data-img="i3.jpg" data-text="In Love : bài hay vãi chưởng🎵">
            <div class="card-header">🎵 Bài hát nghe nhiều nhất</div>
            <img class="card-img" src="i3.jpg" alt="Bài hát">
        </div>

        <div class="card" data-img="i4.png" data-text="chủ tọa🎤 ">
            <div class="card-header">🎤 Rapper thích nhất</div>
            <img class="card-img" src="i4.png" alt="Rapper">
        </div>
    </div>
</div>

<div class="cta-button">
    <button onclick="celebrate()">🎉 Happy New Year 2026 🎉</button>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <img id="modal-img" alt="Preview">
        <div class="modal-text" id="modal-text"></div>
    </div>
</div>

<script>
const cards = document.querySelectorAll('.card');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modal-img');
const modalText = document.getElementById('modal-text');
const closeBtn = document.querySelector('.close');

cards.forEach(card => {
    card.addEventListener('click', () => {
        modalImg.src = card.dataset.img;
        modalText.textContent = card.dataset.text;
        modal.classList.add('show');
    });
});

closeBtn.onclick = () => modal.classList.remove('show');
modal.onclick = e => {
    if (e.target === modal) modal.classList.remove('show');
};

document.querySelectorAll('.check-item').forEach(item => {
    item.addEventListener('click', (e) => {
        if (e.target.tagName !== 'INPUT') {
            const checkbox = item.querySelector('input[type="checkbox"]');
            checkbox.checked = !checkbox.checked;
        }
    });
});

function celebrate() {
    alert('🎊 Chúc mừng năm mới 2026! Chúc bạn một năm tràn đầy niềm vui, thành công và hạnh phúc! 🎊');
    window.location.href = 'firworks.html';
}
</script>

</body>
</html>
