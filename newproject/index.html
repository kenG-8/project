<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal server error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f5f5f5;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
        }

        .header {
            padding: 40px 40px 30px;
            background: white;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 300;
            color: #333;
            margin-bottom: 15px;
        }

        .header p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin: 5px 0;
        }

        .header a {
            color: #3b82f6;
            text-decoration: none;
        }

        .status-bar {
            background: #e8e8e8;
            padding: 60px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            position: relative;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .icon-box {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            position: relative;
        }

        /* Browser Icon */
        .browser-icon {
            width: 70px;
            height: 60px;
            background: #d9d9d9;
            border: 4px solid #999;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .browser-icon::after {
            content: '✓';
            color: #52c41a;
            font-size: 36px;
            font-weight: bold;
        }

        /* Cloud Icon */
        .cloud-icon {
            width: 100px;
            height: 70px;
            position: relative;
        }

        .cloud-base {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 80px;
            height: 30px;
            background: #666;
            border-radius: 40px;
        }

        .cloud-left {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 35px;
            height: 35px;
            background: #666;
            border-radius: 50%;
        }

        .cloud-right {
            position: absolute;
            top: 8px;
            right: 15px;
            width: 42px;
            height: 42px;
            background: #666;
            border-radius: 50%;
        }

        .cloud-error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 38px;
            height: 38px;
            background: #dc3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        .cloud-error::before {
            content: '✕';
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* Host Icon */
        .host-icon {
            width: 70px;
            height: 60px;
            background: #d9d9d9;
            border: 4px solid #999;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .host-icon::after {
            content: '✓';
            color: #52c41a;
            font-size: 36px;
            font-weight: bold;
        }

        /* Connection Lines */
        .connector {
            width: 100px;
            height: 2px;
            background: #999;
            position: relative;
            margin: 0 -10px;
            top: -45px;
        }

        .status-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 400;
        }

        .status-text {
            font-size: 14px;
            font-weight: 500;
        }

        .status-working {
            color: #52c41a;
        }

        .status-error {
            color: #dc3545;
        }

        .content-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            padding: 40px;
            border-top: 1px solid #e8e8e8;
        }

        .info-block {
            padding-right: 40px;
        }

        .info-block:last-child {
            padding-right: 0;
            padding-left: 40px;
            border-left: 1px solid #e8e8e8;
        }

        .info-block h2 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .info-block p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Internal server error</h1>
            <p><strong>Error code 520</strong></p>
            <p>Visit <a href="#">cloudflare.com</a> for more information.</p>
            <p>2025-01-11 02:54:44 UTC</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="icon-box">
                    <div class="browser-icon"></div>
                </div>
                <div class="status-label">Browser</div>
                <div class="status-text status-working">Working</div>
            </div>

            <div class="connector"></div>

            <div class="status-item">
                <div class="icon-box">
                    <div class="cloud-icon">
                        <div class="cloud-left"></div>
                        <div class="cloud-right"></div>
                        <div class="cloud-base"></div>
                        <div class="cloud-error"></div>
                    </div>
                </div>
                <div class="status-label">Cloudflare</div>
                <div class="status-text status-error">Error</div>
            </div>

            <div class="connector"></div>

            <div class="status-item">
                <div class="icon-box">
                    <div class="host-icon"></div>
                </div>
                <div class="status-label">Host</div>
                <div class="status-text status-working">Working</div>
            </div>
        </div>

        <div class="content-section">
            <div class="info-block">
                <h2>What happened?</h2>
                <p>There is an unknown connection issue between Cloudflare's network.</p>
            </div>
            <div class="info-block">
                <h2>What can I do?</h2>
                <p>Refresh to try again in a few minutes.</p>
            </div>
        </div>
    </div>
</body>
</html>
